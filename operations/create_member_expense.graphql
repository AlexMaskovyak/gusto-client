mutation CreateMemberExpense($input: CreateMemberExpenseInput!) {
  payload: createMemberExpense(input: $input) {
    errors {
      argument
      message
    }
    oneTimeReimbursement {
      ...TeamExpense
    }
  }
}

fragment Expense on OneTimeReimbursement {
  id
  amount
  approvedBy
  categoryName
  categoryUuid
  checkDate
  createdAt
  currency
  description
  displayName
  eorOneTimeReimbursement {
    id
    category
    title
  }
  member {
    id
    latestEmployment {
      id
      isEor
      workerType
    }
    preferredFullName
  }
  purchaseDate
  rateData {
    amount
    categoryRateUuid
    name
    rateBaseKind
    rateConversionAmount
  }
  receipt {
    id
    contentType
    name
    url
  }
  status
  statusReason
  vendor {
    id
    name
  }
}

fragment TeamExpense on OneTimeReimbursement {
  availableActions
  ...Expense
}
